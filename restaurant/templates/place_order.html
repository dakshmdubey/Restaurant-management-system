{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Place Order</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .order-card {
            max-width: 500px;
            margin: 60px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: white;
        }

        .title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="order-card">

    <h3 class="title">🍽 Place Your Order</h3>

    <form method="POST">
        {% csrf_token %}

        <!-- Customer Name -->
        <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <input type="text" name="customer_name" class="form-control" placeholder="Enter your name" required>
        </div>

        <!-- Food Item -->
<div class="mb-3">
    <label class="form-label">Food Item</label>
    <select name="food_item" class="form-select" required>
        {% for item in foods %}
            <option value="{{ item.id }}">
                {{ item.name }} - ₹{{ item.price }}
            </option>
        {% endfor %}
    </select>
</div>

<div class="mb-3">
    <label class="form-label">Select Table</label>
    <select name="table" class="form-select" required>
        {% for table in tables %}
            <option value="{{ table.id }}">
                Table {{ table.table_number }}
                ({{ table.capacity }} Persons)
            </option>
        {% endfor %}
    </select>
</div>

        <!-- Quantity -->
        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" name="quantity" class="form-control" min="1" value="1" required>
        </div>

        <!-- Button -->
        <button type="submit" class="btn btn-primary w-100">
            Place Order
        </button>
    </form>

</div>

</body>
</html>
