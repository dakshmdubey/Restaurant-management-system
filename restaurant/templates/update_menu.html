<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .update-card {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="update-card">

        <h2>✏️ Update Menu Item</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Food Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ item.name }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price (₹)</label>
                <input type="number"
                       name="price"
                       class="form-control"
                       value="{{ item.price }}"
                       required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Update Item
            </button>
        </form>

        <a href="{% url 'menu' %}" class="btn btn-secondary w-100 mt-3">
            Back to Menu
        </a>

    </div>
</div>

</body>
</html>
